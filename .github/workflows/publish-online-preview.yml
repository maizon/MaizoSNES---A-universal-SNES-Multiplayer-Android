name: Publish MaizoSNES 0.7 Public Relay Preview

on:
  push:
    branches: [work/android-foundation]
    paths:
      - 'release/PUBLISH_PREVIEW_0.7'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maizo-07-publication
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact preview source
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Locate installed Android sdkmanager
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
      - name: Install pinned Android SDK and native toolchain
        shell: bash
        run: |
          set -euo pipefail
          for _ in {1..100}; do printf 'y\n'; done > /tmp/maizo-licenses.txt
          "${{ steps.sdk.outputs.sdkmanager }}" --licenses < /tmp/maizo-licenses.txt
          "${{ steps.sdk.outputs.sdkmanager }}" --install "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
      - name: Verify real public HTTPS directory and Internet TCP relay
        run: node scripts/verify_public_relay.js
      - name: Unit tests and build installable Android APK
        shell: bash
        run: |
          set -euo pipefail
          node --test server/relay.test.js
          bash scripts/fetch_snes9x.sh
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Check APK and certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libnative-lib.so'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
      - name: Upload backup build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaizoSNES-0.7-ARM64-online-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish GitHub prerelease if version not already present
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.7.0-preview.1
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; preserving it."
            exit 0
          fi
          {
            cat docs/CHANGELOG_0.7.md
            echo
            echo "---"
            echo
            echo "MaizoSNES experimental ARM64 preview. The first-party online room registry is live."
            echo "Relay traffic is plain TCP (not end-to-end encrypted); use only in trusted tests."
            echo "Tested: real public HTTPS directory and TCP HOST/JOIN handshake in CI."
            echo "Android-to-Android gameplay is still experimental and is NOT verified by these checks."
            echo "DEBUG certificate is generated in CI; it may not match older APK installations."
            echo "No commercial game ROMs are included. Snes9x license restricts commercial use."
          } > /tmp/maizo07-release-notes.md
          gh release create "$TAG" \
            "app/build/outputs/apk/debug/app-debug.apk#MaizoSNES-v0.7.0-ARM64-online-preview.apk" \
            "apk-sha256.txt#MaizoSNES-v0.7.0-online-SHA256.txt" \
            --target "$(git rev-parse HEAD)" \
            --title "MaizoSNES v0.7.0 Preview — salas online" \
            --notes-file /tmp/maizo07-release-notes.md \
            --prerelease --latest=false
