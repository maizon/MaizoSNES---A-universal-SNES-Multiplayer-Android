name: Publish Signed MaizoSNES (manual)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New preview tag (e.g. v0.6.0-preview)'
        required: true
        type: string
      reviewed_licenses:
        description: 'I reviewed non-commercial Snes9x and all third-party distribution obligations'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    if: inputs.reviewed_licenses == true
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout selected version
        uses: actions/checkout@v4
      - name: Validate publishing tag and distribution approval
        shell: bash
        env:
          MAIZO_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$MAIZO_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(preview|beta)(\.[0-9]+)?$ ]] || {
            echo "Use vX.Y.Z-preview or vX.Y.Z-beta.1" >&2
            exit 1
          }
          echo "MAIZO_TAG=$MAIZO_TAG" >> "$GITHUB_ENV"
      - name: Validate stable release signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MAIZO_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.MAIZO_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MAIZO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MAIZO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?Configure MAIZO_KEYSTORE_B64 repository secret}"
          : "${STORE_PASSWORD:?Configure MAIZO_STORE_PASSWORD}"
          : "${KEY_ALIAS:?Configure MAIZO_KEY_ALIAS}"
          : "${KEY_PASSWORD:?Configure MAIZO_KEY_PASSWORD}"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/maizosnes-release.jks"
          chmod 600 "$RUNNER_TEMP/maizosnes-release.jks"
          echo "MAIZO_KEYSTORE_PATH=$RUNNER_TEMP/maizosnes-release.jks" >> "$GITHUB_ENV"
          echo "MAIZO_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MAIZO_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MAIZO_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Install pinned Android SDK/NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          for _ in {1..100}; do printf 'y\n'; done > /tmp/android-licenses.txt
          "$SDKMANAGER" --licenses </tmp/android-licenses.txt
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" \
            "ndk;26.3.11579264" "cmake;3.22.1"
      - name: Prepare upstream SNES core with preserved licenses
        run: bash scripts/fetch_snes9x.sh
      - name: Verify ROM-free source, unit tests and build signed release
        run: |
          set -euo pipefail
          node --test server/relay.test.js
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Verify APK signature and SHA256
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$MAIZO_TAG" >/dev/null 2>&1; then
            echo "Tag already has a release: $MAIZO_TAG" >&2
            exit 1
          fi
          gh release create "$MAIZO_TAG" \
            "app/build/outputs/apk/release/app-release.apk#MaizoSNES-ARM64-signed.apk" \
            --target "$(git rev-parse HEAD)" \
            --title "MaizoSNES $MAIZO_TAG" \
            --notes-file docs/CHANGELOG_0.6.md --prerelease
