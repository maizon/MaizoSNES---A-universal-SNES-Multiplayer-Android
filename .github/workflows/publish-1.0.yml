name: Publish MaizoSNES 1.0 (signed)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maizosnes-stable-release
  cancel-in-progress: false

jobs:
  stable:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Install pinned Android SDK/NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          for _ in {1..100}; do printf 'y\n'; done >/tmp/licenses.txt
          "$SDKMANAGER" --licenses </tmp/licenses.txt
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
      - name: Restore stable keystore from GitHub Secrets
        shell: bash
        env:
          STORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.MAIZO_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.MAIZO_STORE_PASSWORD }}
          ALIAS: ${{ secrets.KEY_ALIAS || secrets.MAIZO_KEY_ALIAS }}
          PASS: ${{ secrets.KEY_PASSWORD || secrets.MAIZO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${STORE_BASE64:?Configure KEYSTORE_BASE64}"
          : "${STORE_PASSWORD:?Configure KEYSTORE_PASSWORD}"
          : "${ALIAS:?Configure KEY_ALIAS}"
          : "${PASS:?Configure KEY_PASSWORD}"
          printf '%s' "$STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/maizosnes-release.jks"
          chmod 600 "$RUNNER_TEMP/maizosnes-release.jks"
          echo "MAIZO_KEYSTORE_PATH=$RUNNER_TEMP/maizosnes-release.jks" >>"$GITHUB_ENV"
      - name: Test pre-release quality
        run: |
          set -euo pipefail
          bash scripts/fetch_snes9x.sh
          bash scripts/fetch_gekkonet.sh
          node --test server/relay.test.js
          ./gradlew --no-daemon testDebugUnitTest
      - name: Build signed universal APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.MAIZO_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.MAIZO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.MAIZO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -l "$APK" > "$RUNNER_TEMP/apk-list.txt"
          grep -Eq 'lib/arm64-v8a/libnative-lib\.so$' "$RUNNER_TEMP/apk-list.txt"
          grep -Eq 'lib/armeabi-v7a/libnative-lib\.so$' "$RUNNER_TEMP/apk-list.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" dist/MaizoSNES-v1.0.0-universal-signed.apk
          cd dist
          sha256sum MaizoSNES-v1.0.0-universal-signed.apk > apk-sha256.txt
      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaizoSNES-v1.0.0-universal-signed
          path: dist/
          if-no-files-found: error
      - name: Publish stable official release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists; never overwrite an existing stable tag." >&2
            exit 1
          fi
          gh release create v1.0.0 \
            "dist/MaizoSNES-v1.0.0-universal-signed.apk" \
            "dist/apk-sha256.txt" \
            --target "$(git rev-parse HEAD)" \
            --title "MaizoSNES v1.0.0 — Emulador SNES Universal" \
            --notes-file docs/RELEASE.md --latest
