name: Android CI

on:
  push:
    branches: [main, work/android-foundation]
  pull_request:
    branches: [main, work/android-foundation]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Locate Android SDK tools
        id: android-sdk
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          echo "root=$SDK_ROOT" >> "$GITHUB_OUTPUT"
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          for _ in {1..100}; do printf 'y\n'; done > /tmp/android-sdk-licenses.txt
          "${{ steps.android-sdk.outputs.sdkmanager }}" --licenses < /tmp/android-sdk-licenses.txt

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.android-sdk.outputs.sdkmanager }}" --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Cache Android NDK and CMake
        uses: actions/cache@v4
        id: cache-ndk-cmake
        with:
          path: |
            ${{ steps.android-sdk.outputs.root }}/ndk
            ${{ steps.android-sdk.outputs.root }}/cmake
          key: ndk-cmake-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts', 'app/src/main/cpp/CMakeLists.txt') }}-v1

      - name: Install pinned NDK and CMake
        if: steps.cache-ndk-cmake.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.android-sdk.outputs.sdkmanager }}" --install \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Prepare pinned Snes9x source and license assets
        run: bash scripts/fetch_snes9x.sh

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify native library is packaged
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK" | tee /tmp/apk-contents.txt
          grep -Eq 'lib/arm64-v8a/libnative-lib\.so$' /tmp/apk-contents.txt
          grep -Eq 'assets/licenses/snes9x[.]txt$' /tmp/apk-contents.txt
          grep -Eq 'assets/licenses/snes_ntsc-license[.]txt$' /tmp/apk-contents.txt
          if grep -Eq 'lib/arm64-v8a/libc\+\+_shared\.so$' /tmp/apk-contents.txt; then
            echo "Unexpected shared C++ runtime; expected c++_static." >&2
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
