name: Android CI

concurrency:
  # A push and its matching pull-request event share the head branch name.
  group: android-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches: [main, work/android-foundation]
    paths-ignore:
      - docs/CI_PERFORMANCE.md
  pull_request:
    branches: [main, work/android-foundation]
    paths-ignore:
      - docs/CI_PERFORMANCE.md

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Locate Android SDK tools
        id: android-sdk
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          echo "root=$SDK_ROOT" >> "$GITHUB_OUTPUT"
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          for _ in {1..100}; do printf 'y\n'; done > /tmp/android-sdk-licenses.txt
          "${{ steps.android-sdk.outputs.sdkmanager }}" --licenses < /tmp/android-sdk-licenses.txt
      - name: Install Android platform, build tools, pinned NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.android-sdk.outputs.sdkmanager }}" --install "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
      - name: Set up Node.js 22 for WebSocket integration tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test TCP, TLS, WSS and local public-smoke protocol
        run: |
          node --test server/*.test.js
          grep -q 'server/ice-directory.js' Dockerfile
          grep -q 'ice-directory.js' server/Dockerfile
      - name: Prepare pinned Snes9x source and license assets
        run: bash scripts/fetch_snes9x.sh
      - name: Fetch pinned GekkoNet SDK and keep license
        run: bash scripts/fetch_gekkonet.sh
      - name: Build pinned FCEUmm NES core for ARMv7 and ARM64
        run: bash scripts/fetch_fceumm.sh --build
      - name: Run loopback multiplayer tests and build debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Verify native library is packaged
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK" | tee /tmp/apk-contents.txt
          grep -Eq 'lib/arm64-v8a/libnative-lib\.so$' /tmp/apk-contents.txt
          grep -Eq 'lib/armeabi-v7a/libnative-lib\.so$' /tmp/apk-contents.txt
          grep -Eq 'lib/arm64-v8a/libgekko_bridge[.]so$' /tmp/apk-contents.txt
          grep -Eq 'lib/armeabi-v7a/libgekko_bridge[.]so$' /tmp/apk-contents.txt
          grep -Eq 'assets/licenses/gekkonet-bsd-2[.]txt$' /tmp/apk-contents.txt
          grep -Eq 'assets/licenses/snes9x[.]txt$' /tmp/apk-contents.txt
          grep -Eq 'lib/arm64-v8a/libfceumm_libretro[.]so$' /tmp/apk-contents.txt
          grep -Eq 'lib/armeabi-v7a/libfceumm_libretro[.]so$' /tmp/apk-contents.txt
          grep -Eq 'assets/licenses/fceumm-gpl2[.]txt$' /tmp/apk-contents.txt
          # Lowend JNI fast path must be exported by both ABI builds.
          NM="${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          for ABI in arm64-v8a armeabi-v7a; do
            unzip -p "$APK" "lib/$ABI/libnative-lib.so" > "/tmp/lowend-core-$ABI.so"
            unzip -p "$APK" "lib/$ABI/libgekko_bridge.so" > "/tmp/lowend-gekkonet-$ABI.so"
            "$NM" -D "/tmp/lowend-core-$ABI.so" | grep -q 'nativeSerializeStateIntoDirect'
            "$NM" -D "/tmp/lowend-core-$ABI.so" | grep -q 'nativeUnserializeStateFromDirect'
            "$NM" -D "/tmp/lowend-gekkonet-$ABI.so" | grep -q 'nativeConfigureFastSnapshots'
          done
          grep -Eq 'assets/licenses/snes_ntsc-license[.]txt$' /tmp/apk-contents.txt
          if grep -Eq 'lib/arm64-v8a/libc\+\+_shared\.so$' /tmp/apk-contents.txt; then
            echo "Unexpected shared C++ runtime; expected c++_static." >&2
            exit 1
          fi
          stat -c 'APK_SIZE_BYTES=%s' "$APK"
          sha256sum "$APK" | awk '{ print "APK_SHA256=" $1 }'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Probe live Railway HTTPS API and WSS (external, non-blocking)
        id: railway_smoke
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/verify_public_wss.js
      - name: Record live relay verification separately from APK result
        if: always()
        run: |
          echo "Railway public WSS smoke outcome: ${{ steps.railway_smoke.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "External uptime is not an APK build gate; see smoke step logs." >> "$GITHUB_STEP_SUMMARY"

      # GitHub Actions artifacts are always ZIP wrappers. The GitHub Release
      # below instead attaches a directly installable standalone .apk.
      - name: Prepare standalone signed Android APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/work/android-foundation'
        id: standalone
        shell: bash
        env:
          STORE_B64: ${{ secrets.KEYSTORE_BASE64 || secrets.MAIZO_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || secrets.MAIZO_STORE_PASSWORD }}
          SIGN_ALIAS: ${{ secrets.KEY_ALIAS || secrets.MAIZO_KEY_ALIAS }}
          SIGN_PASS: ${{ secrets.KEY_PASSWORD || secrets.MAIZO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          APKSIGNER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0/apksigner"
          if [[ -n "$STORE_B64" && -n "$STORE_PASS" && -n "$SIGN_ALIAS" && -n "$SIGN_PASS" ]]; then
            printf '%s' "$STORE_B64" | base64 --decode > "$RUNNER_TEMP/maizosnes-final.jks"
            chmod 600 "$RUNNER_TEMP/maizosnes-final.jks"
            export MAIZO_KEYSTORE_PATH="$RUNNER_TEMP/maizosnes-final.jks"
            export MAIZO_STORE_PASSWORD="$STORE_PASS"
            export MAIZO_KEY_ALIAS="$SIGN_ALIAS"
            export MAIZO_KEY_PASSWORD="$SIGN_PASS"
            ./gradlew --no-daemon assembleRelease
            APK="app/build/outputs/apk/release/app-release.apk"
            DEST="MaizoSNES-Universal-LAN-Signed.apk"
            echo "SIGNATURE_TYPE=release" >> "$GITHUB_ENV"
          else
            echo "No stable release key configured: publishing clearly labeled DEBUG preview." >&2
            APK="app/build/outputs/apk/debug/app-debug.apk"
            DEST="MaizoSNES-Universal-LAN-Debug-Preview.apk"
            echo "SIGNATURE_TYPE=debug" >> "$GITHUB_ENV"
          fi
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" "dist/$DEST"
          echo "filename=$DEST" >> "$GITHUB_OUTPUT"
          sha256sum "dist/$DEST" > dist/SHA256SUMS.txt
          echo "Standalone APK: $DEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish directly installable APK on GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/work/android-foundation'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_FILENAME: ${{ steps.standalone.outputs.filename }}
        run: |
          set -euo pipefail
          TAG="v1.0.0-remote-lan.${GITHUB_RUN_NUMBER}"
          test -s "dist/$APK_FILENAME"
          {
            echo "🎮 MaizoSNES — Controle Remoto LAN (prévia Android)"
            echo
            echo "Use outro celular como controle do jogador 2 na mesma Wi-Fi."
            echo "Sem internet, sem vídeo ou ROM no cliente."
            echo "Nicknames, layouts e gamepads físicos suportados."
            echo "O anfitrião aceita/rejeita ou permite aceitação automática em 10 s."
            echo
            echo "⚠️ Modo controle remoto ainda requer testes reais em dois aparelhos."
            echo "Somente P1 local + P2 remoto nesta prévia."
            if [[ "$SIGNATURE_TYPE" == "debug" ]]; then
              echo "⚠️ Build de desenvolvimento assinada com chave DEBUG; não é assinatura estável de produção."
              echo "O pacote .debug é independente do pacote de produção."
            else
              echo "APK universal de release assinado com a chave configurada no repositório."
            fi
            echo "ROMs e BIOS não incluídas."
          } > dist/NOTES.txt
          gh release create "$TAG" "dist/$APK_FILENAME" "dist/SHA256SUMS.txt" \
            --target "$GITHUB_SHA" \
            --title "MaizoSNES • Controle Remoto LAN • $TAG" \
            --notes-file dist/NOTES.txt --prerelease
          echo "APK direto: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK_FILENAME" >> "$GITHUB_STEP_SUMMARY"
