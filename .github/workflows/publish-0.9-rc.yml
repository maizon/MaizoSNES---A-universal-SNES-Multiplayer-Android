name: Publish MaizoSNES 0.9 Official Repository Release Candidate

on:
  push:
    branches: [work/android-foundation]
    paths:
      - 'release/PUBLISH_RC_0.9'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maizo-09-rc-publication
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact preview source
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Locate installed Android sdkmanager
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
      - name: Install pinned Android SDK and native toolchain
        shell: bash
        run: |
          set -euo pipefail
          for _ in {1..100}; do printf 'y\n'; done > /tmp/maizo-licenses.txt
          "${{ steps.sdk.outputs.sdkmanager }}" --licenses < /tmp/maizo-licenses.txt
          "${{ steps.sdk.outputs.sdkmanager }}" --install "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
      - name: Unit tests and build installable Android APK
        shell: bash
        run: |
          set -euo pipefail
          node --test server/relay.test.js
          bash scripts/fetch_snes9x.sh
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Check APK and certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libnative-lib.so'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" MaizoSNES-v0.9.0-ARM64-rc1.apk
          sha256sum MaizoSNES-v0.9.0-ARM64-rc1.apk | tee apk-sha256.txt
      - name: Upload backup build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaizoSNES-0.9-ARM64-netplay-low-latency
          path: MaizoSNES-v0.9.0-ARM64-rc1.apk
          if-no-files-found: error
      - name: Publish GitHub prerelease if version not already present
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.9.0-rc.1
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; preserving it."
            exit 0
          fi
          {
            cat docs/CHANGELOG_0.9.md
            echo
            echo "---"
            echo
            echo "MaizoSNES v0.9.0 RC1 — Android arm64-v8a experimental."
            echo "Changes: MZNP v5 pipelined input, RTT-adaptive buffer, 200ms RTT synthetic regression test,"
            echo "three latency profiles and VirtualGamePad Mobile-inspired independent vector controls."
            echo "Tests are CI/JVM loopback only: real phone+VM and phone+phone 60 FPS are NOT yet confirmed."
            echo "Direct LAN is supported; global CGNAT uses outbound TCP relay, not direct WAN P2P."
            echo "Relayed traffic is plain TCP, so use trusted networks or a secure VPN."
            echo "No third-party GPL gamepad source/artwork is embedded. ROMs are NOT included."
            echo "This is a DEBUG-signed preview, not a production keystore signature."
            echo "Uninstall a debug APK signed by a different CI key before installing this one."
            echo "Snes9x distribution is noncommercial and requires license notices preserved."
          } > /tmp/maizo09-release-notes.md
          gh release create "$TAG" \
            "MaizoSNES-v0.9.0-ARM64-rc1.apk" \
            "apk-sha256.txt#MaizoSNES-v0.9.0-SHA256.txt" \
            --target "$(git rev-parse HEAD)" \
            --title "MaizoSNES v0.9.0-rc.1 — Input Pipelining + VirtualGamePad" \
            --notes-file /tmp/maizo09-release-notes.md \
            --prerelease --latest=false
