name: Publish Installable MaizoSNES Preview

# Developer preview built with the Android DEBUG signature.
# A permanent production-signed release requires a private owner keystore;
# see .github/workflows/publish-signed.yml.
on:
  push:
    branches: [work/android-foundation]
    paths:
      - 'release/PUBLISH_PREVIEW_0.6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maizo-preview-publication
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact preview commit
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Locate pinned Android SDK tools
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
      - name: Install Android 35 and NDK
        shell: bash
        run: |
          set -euo pipefail
          for _ in {1..100}; do printf 'y\n'; done > /tmp/maizo-licenses.txt
          "${{ steps.sdk.outputs.sdkmanager }}" --licenses < /tmp/maizo-licenses.txt
          "${{ steps.sdk.outputs.sdkmanager }}" --install "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
      - name: Test relay server and assemble APK
        shell: bash
        run: |
          set -euo pipefail
          node --test server/relay.test.js
          bash scripts/fetch_snes9x.sh
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Check APK, arm64 native library and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libnative-lib.so'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
      - name: Upload installable preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaizoSNES-0.6-ARM64-preview-debug-signed
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.6.0-preview.1
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Preview release already exists ($TAG); leaving it unchanged."
            exit 0
          fi
          {
            cat docs/CHANGELOG_0.6.md
            echo
            echo '---'
            echo
            echo '**IMPORTANTE: esta é uma versão DEBUG de testes, ARM64, assinada por certificado de desenvolvimento gerado na CI.**'
            echo 'Não é uma release de produção com certificado permanente. Para uma distribuição estável, configure o keystore privado de produção.'
            echo 'APK sem ROMs comerciais. Software Snes9x somente para uso não comercial, conforme LICENSES/snes9x.txt.'
          } > /tmp/maizo-preview-notes.md
          gh release create "$TAG" \
            "app/build/outputs/apk/debug/app-debug.apk#MaizoSNES-v0.6.0-ARM64-preview.apk" \
            "apk-sha256.txt#MaizoSNES-v0.6.0-SHA256.txt" \
            --target "$(git rev-parse HEAD)" \
            --title "MaizoSNES v0.6.0-preview.1 · ARM64 experimental" \
            --notes-file /tmp/maizo-preview-notes.md \
            --prerelease --latest=false
